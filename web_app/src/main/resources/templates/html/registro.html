<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - Web App Educativa</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h2 style="text-align: center; color: var(--primary-color);">Registro de Usuario</h2>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <form action="/registro" method="post">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div class="form-group">
                <label for="num_celular">Celular:</label>
                <input type="number" id="num_celular" name="num_celular" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="rol">Soy:</label>
                <select id="rol" name="rol">
                    <option value="ROL_ESTUDIANTE">Estudiante</option>
                    <option value="ROL_PROFESOR">Profesor (Tutor)</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 2rem;">
                <button type="submit" class="btn">Registrarse</button>
            </div>
        </form>
        <p style="text-align: center; margin-top: 1rem;">¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></p>
    </div>
</body>

</html>
