<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Registro - Web App Educativa</title>
    <!-- Add your CSS links here -->
</head>

<body>
    <div style="max-width: 400px; margin: 0 auto; padding: 20px;">
        <h2>Registro de Usuario</h2>

        <div th:if="${error}" style="color: red; margin-bottom: 10px;">
            <p th:text="${error}"></p>
        </div>

        <form action="/registro" method="post">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>
            <div>
                <label for="num_celular">Celular:</label>
                <input type="number" id="num_celular" name="num_celular" required>
            </div>
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div>
                <label for="rol">Soy:</label>
                <select id="rol" name="rol">
                    <option value="ROL_ESTUDIANTE">Estudiante</option>
                    <option value="ROL_PROFESOR">Profesor (Tutor)</option>
                </select>
            </div>
            <div style="margin-top: 20px;">
                <button type="submit">Registrarse</button>
            </div>
        </form>
        <p>¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></p>
    </div>
</body>

</html>
