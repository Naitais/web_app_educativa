<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Crear Perfil - Web App Educativa</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            /* Ensures padding doesn't affect width */
            font-size: 1rem;
        }

        input:focus,
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error {
            color: #dc3545;
            text-align: center;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Completa tu Perfil</h2>

        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>

        <form action="/crear-perfil" method="post">
            <div class="form-group">
                <label for="biografia">Biografía:</label>
                <textarea id="biografia" name="biografia" rows="4" placeholder="Cuéntanos sobre ti..."
                    required></textarea>
            </div>
            <div class="form-group">
                <label for="foto">URL de Foto de Perfil:</label>
                <input type="text" id="foto" name="foto" placeholder="https://ejemplo.com/foto.jpg" required>
            </div>
            <div class="form-group">
                <label for="certificados">Certificados (Opcional):</label>
                <input type="text" id="certificados" name="certificados" placeholder="Curso A, Curso B">
            </div>
            <div class="form-group">
                <label for="experiencia">Experiencia (Opcional):</label>
                <input type="text" id="experiencia" name="experiencia" placeholder="5 años en docencia...">
            </div>

            <button type="submit">Guardar Perfil</button>
        </form>
    </div>
</body>

</html>
