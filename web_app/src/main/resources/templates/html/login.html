<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Iniciar Sesión - Tatutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-container">
    <div class="brand-title">Tatutor</div>
    <div class="brand-subtitle">¡Tu plataforma de aprendizaje!</div>

    <div th:if="${param.error}" class="error-message">
        Credenciales inválidas. Inténtalo de nuevo.
    </div>
    
    <div th:if="${param.logout}" class="success-message">
        Has cerrado sesión correctamente.
    </div>

    <div th:if="${param.registered}" class="success-message">
        Cuenta creada exitosamente. ¡Inicia sesión!
    </div>

    <!-- La acción por defecto para Spring Security es /login con POST -->
    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label for="username">Correo Electrónico:</label>
            <input type="text" id="username" name="username" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
    </div>
<footer id="footer">
    <p>&copy; 2026 Tatutor. Todos los derechos reservados.</p>
</footer>

</body>
</html>
