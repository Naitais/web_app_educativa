<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Iniciar Sesión - Tatutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fceea7; /* Light yellow background */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-title {
            color: #d19f00; /* Darker yellow/gold for the brand */
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffcc00;
            box-shadow: 0 0 0 3px rgba(255, 204, 0, 0.2);
        }

        .btn-submit {
            width: 100%;
            background-color: #ffcc00; /* Vibrant Yellow */
            color: #1a1a1a;
            border: none;
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #e6b800;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .register-link {
            display: block;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .register-link a {
            color: #d19f00;
            font-weight: 600;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background-color: #fff3f3;
            color: #d8000c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #ffdddd;
        }
        
        .success-message {
            background-color: #f2faf3;
            color: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #e2f1e4;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="brand-title">Tatutor</div>
    <div class="brand-subtitle">¡Tu plataforma de aprendizaje!</div>

    <div th:if="${param.error}" class="error-message">
        Credenciales inválidas. Inténtalo de nuevo.
    </div>
    
    <div th:if="${param.logout}" class="success-message">
        Has cerrado sesión correctamente.
    </div>

    <div th:if="${param.registered}" class="success-message">
        Cuenta creada exitosamente. ¡Inicia sesión!
    </div>

    <!-- The default action for Spring Security is /login with POST -->
    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label for="username">Correo Electrónico:</label>
            <input type="text" id="username" name="username" required placeholder="correo@ejemplo.com">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="Tu contraseña">
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div class="register-link">
        ¿No tienes cuenta? <a th:href="@{/register}">Regístrate aquí</a>
    </div>
<footer id="footer">
    <p>&copy; 2026 Tatutor. Todos los derechos reservados.</p>
</footer>

</body>
</html>
