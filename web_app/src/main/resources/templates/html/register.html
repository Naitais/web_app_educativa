<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - Tatutor</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

<div class="register-container">
    <h2 style="text-align: center; margin-top: 0;">Registrarse en Tatutor</h2>
    
    <div th:if="${error != null}" class="error-message">
        <p th:text="${error}">Error message here</p>
    </div>

    <!-- la acción va a /register porque lo definimos en RegisterController -->
    <form th:action="@{/register}" th:object="${usuario}" method="post">
        
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" th:field="*{nombre}" required placeholder="Tu nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" th:field="*{apellido}" required placeholder="Tu apellido">
        </div>

        <div class="form-group">
            <label for="numCelular">Celular:</label>
            <input type="text" id="numCelular" th:field="*{numCelular}" required placeholder="Ej: 1122334455">
        </div>

        <div class="form-group">
            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" th:field="*{fechaNacimiento}" required>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" th:field="*{email}" required placeholder="ejemplo@correo.com">
        </div>

        <div class="form-group">
            <label for="contraseña">Contraseña:</label>
            <input type="password" id="contraseña" th:field="*{contraseña}" required placeholder="Mínimo 8 caracteres, mayúscula, minúscula, símbolo y número">
            <small style="color: #666;">Ej: Password123!</small>
        </div>

        <div class="form-group">
            <label for="confirmContraseña">Confirmar Contraseña:</label>
            <input type="password" id="confirmContraseña" th:field="*{confirmContraseña}" required>
        </div>

        <div class="form-group">
            <label for="rol">Tipo de Cuenta (Rol):</label>
            <select id="rol" th:field="*{rol}" required>
                <option value="ROL_ESTUDIANTE">Estudiante (Alumno)</option>
                <option value="ROL_PROFESOR">Profesor (Tutor)</option>
                <option value="ROL_INSTITUCION">Institución</option>
            </select>
        </div>

        <!-- Parent info for minor students -->
        <div id="parentInfoSection" style="display: none; border: 2px solid #f39c12; border-radius: 8px; padding: 15px; margin-bottom: 15px; background-color: #fef9e7;">
            <p style="margin-top: 0; font-weight: bold; color: #e67e22;">⚠ Al ser menor de edad, debes proporcionar los datos de un adulto responsable:</p>
            <div class="form-group">
                <label for="nombreAdulto">Nombre del Adulto Responsable:</label>
                <input type="text" id="nombreAdulto" th:field="*{nombreAdulto}" placeholder="Nombre completo del adulto">
            </div>
            <div class="form-group">
                <label for="numCelularAdulto">Celular del Adulto Responsable:</label>
                <input type="text" id="numCelularAdulto" th:field="*{numCelularAdulto}" placeholder="Ej: 1122334455">
            </div>
        </div>

        <button type="submit" class="btn-submit">Crear cuenta</button>
        
    </form>
    
    <a th:href="@{/login}" class="login-link">¿Ya tienes cuenta? Inicia sesión aquí</a>

    </div>

<script>
    function checkMinorStatus() {
        var rol = document.getElementById('rol').value;
        var fechaNac = document.getElementById('fechaNacimiento').value;
        var section = document.getElementById('parentInfoSection');
        var nombreAdulto = document.getElementById('nombreAdulto');
        var numCelularAdulto = document.getElementById('numCelularAdulto');
        
        if (rol === 'ROL_ESTUDIANTE' && fechaNac) {
            var birthDate = new Date(fechaNac);
            var today = new Date();
            var age = today.getFullYear() - birthDate.getFullYear();
            var monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            if (age < 18) {
                section.style.display = 'block';
                nombreAdulto.required = true;
                numCelularAdulto.required = true;
                return;
            }
        }
        section.style.display = 'none';
        nombreAdulto.required = false;
        numCelularAdulto.required = false;
    }
    
    document.getElementById('rol').addEventListener('change', checkMinorStatus);
    document.getElementById('fechaNacimiento').addEventListener('change', checkMinorStatus);
    // Run on page load in case values are pre-filled (e.g. after validation error)
    checkMinorStatus();
</script>

</body>
</html>
